name: mapifyit-geo-platform
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    image: mapifyit-geo-platform-backend:v10.17-production-20260806
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MAPIFY_V10_INTERNAL_TOKEN_FILE: /run/secrets/mapify-v10-api-token
    volumes:
      - /etc/mapify-v10/mapify-api.token:/run/secrets/mapify-v10-api-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:5000:5000'
    networks:
      default: {}
      v10-mapping-edge:
        aliases:
          - mapify-mapping-api
  admin-panel:
    build:
      context: ../mapifyit-admin-panel
      args:
        VITE_API_URL: ${ADMIN_PANEL_VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:5173:80'
volumes:
  postgres_data:
  redis_data:

networks:
  v10-mapping-edge:
    external: true
    name: mapify-v10-mapping-edge
